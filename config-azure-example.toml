[cloud]
# Azure Cloud Provider Configuration
provider = "azure"

# AWS Configuration (unused when provider = "azure")
aws_profile = "bedrock"
aws_region = "ap-southeast-2"
aws_llm_model = "anthropic.claude-3-5-sonnet-20241022-v2:0"

# Azure Configuration
azure_subscription_id = "your-subscription-id"
azure_resource_group = "your-resource-group"
azure_region = "australiaeast"
azure_openai_endpoint = "https://your-resource.openai.azure.com/"  # Set your Azure OpenAI endpoint
azure_openai_key = ""  # Set via AZURE_OPENAI_KEY env var
azure_openai_model = "gpt-4"
azure_text_analytics_endpoint = "https://your-resource.cognitiveservices.azure.com/"
azure_text_analytics_key = ""  # Set via AZURE_TEXT_ANALYTICS_KEY env var

# Other cloud providers (unused when provider = "azure")
gcp_project_id = ""
gcp_region = "australia-southeast1"
gcp_credentials_path = ""
gcp_vertex_model = "gemini-pro"
oracle_compartment_id = ""
oracle_region = "ap-sydney-1"
oracle_config_file = "~/.oci/config"
oracle_profile = "DEFAULT"
oracle_llm_model = "cohere.command-r-plus"

[security]
pii_scanner = true
nightfall_scanner = true
security_scanner = true
permission_checker = true

[analysis]
command_analysis = true
ai_analysis = true

[features]
streaming = true
visual_indicators = true
execution_mode = "interactive"

[model]
# Local LLM fallback
use_local_llm = false
local_llm_endpoint = "http://localhost:11434/api/generate"
local_llm_model = "deepseek-coder:6.7b"
provider = "bedrock"
openai_api_key = ""
openai_model = "gpt-4"
openai_endpoint = "https://api.openai.com/v1/chat/completions"
gemini_api_key = ""
gemini_model = "gemini-pro"
gemini_endpoint = "https://generativelanguage.googleapis.com/v1beta/models"
default_model = "anthropic.claude-3-5-sonnet-20241022-v2:0"
