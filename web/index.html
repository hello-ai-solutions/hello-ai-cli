<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello AI CLI - Web Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 1rem;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            margin-bottom: 1rem;
            min-height: 400px;
        }
        .message {
            margin-bottom: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            max-width: 80%;
        }
        .user { 
            background: #007bff; 
            color: white; 
            margin-left: auto;
            text-align: right;
        }
        .assistant { 
            background: #f8f9fa; 
            color: #333;
            border-left: 4px solid #28a745;
        }
        .input-container {
            display: flex;
            gap: 0.5rem;
        }
        input {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            background: rgba(255,255,255,0.9);
        }
        button {
            padding: 0.8rem 1.5rem;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background: #218838; }
        .status { 
            text-align: center; 
            color: rgba(255,255,255,0.8); 
            margin-top: 0.5rem; 
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Hello AI CLI</h1>
        <p>Web Interface • Multi-Cloud LLM Support</p>
    </div>
    
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message assistant">
                <strong>Hello AI:</strong> Welcome to the Hello AI web interface! Type your message below to get started.
            </div>
        </div>
        
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
        
        <div class="status" id="status">Ready</div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const messages = document.getElementById('messages');
            const status = document.getElementById('status');
            
            if (!input.value.trim()) return;
            
            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `<strong>You:</strong> ${input.value}`;
            messages.appendChild(userMsg);
            
            const userMessage = input.value;
            input.value = '';
            status.textContent = 'Sending...';
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: 'user', content: userMessage })
                });
                
                const data = await response.json();
                
                // Add assistant response
                const assistantMsg = document.createElement('div');
                assistantMsg.className = 'message assistant';
                assistantMsg.innerHTML = `<strong>Hello AI:</strong> ${data.content}`;
                messages.appendChild(assistantMsg);
                
                status.textContent = 'Ready';
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
            }
            
            messages.scrollTop = messages.scrollHeight;
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Load conversation history on page load
        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const history = await response.json();
                const messages = document.getElementById('messages');
                
                history.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.role}`;
                    msgDiv.innerHTML = `<strong>${msg.role === 'user' ? 'You' : 'Hello AI'}:</strong> ${msg.content}`;
                    messages.appendChild(msgDiv);
                });
                
                messages.scrollTop = messages.scrollHeight;
            } catch (error) {
                console.log('No previous history');
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
